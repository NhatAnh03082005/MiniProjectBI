name: amazon_delivery_bi
version: "1.0.0"
config-version: 2

profile: amazon_delivery_bi

on-run-start:
  - "{{ validate_delivery_rules() }}"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Edit business-rule values here. SQL models and data tests read the same values.
vars:
  delivery_rules:
    missing_tokens: ["", "NAN", "NULL"]
    unknown_label: "Unknown"
    invalid_rating_label: "Invalid"
    area_aliases:
      Metropolitian: Metropolitan
    fields:
      - {source: Order_ID, staged: order_id, required: true, unique: true, missing_error: MISSING_ORDER_ID, expected: "required unique order ID after trimming"}
      - {source: Agent_Age, staged: agent_age, required: true, cast_check: true, range: agent_age, expected: "required smallint within configured age range"}
      - {source: Agent_Rating, staged: agent_rating_raw, required: true, cast_check: true, range: agent_rating, expected: "required decimal rating within configured rating range"}
      - {source: Store_Latitude, staged: store_latitude, required: true, cast_check: true, range: latitude, expected: "required latitude within configured range"}
      - {source: Store_Longitude, staged: store_longitude, required: true, cast_check: true, range: longitude, expected: "required longitude within configured range"}
      - {source: Drop_Latitude, staged: drop_latitude, required: true, cast_check: true, range: latitude, expected: "required latitude within configured range"}
      - {source: Drop_Longitude, staged: drop_longitude, required: true, cast_check: true, range: longitude, expected: "required longitude within configured range"}
      - {source: Order_Date, staged: order_date, required: true, cast_check: true, expected: "required valid date"}
      - {source: Order_Time, staged: order_time, required: true, cast_check: true, expected: "required valid time"}
      - {source: Pickup_Time, staged: pickup_time, required: true, cast_check: true, expected: "required valid time"}
      - {source: Weather, staged: weather_name, normalized: weather_name_normalized, required: false, unknown_if_missing: true, expected: "required weather category"}
      - {source: Traffic, staged: traffic_level, normalized: traffic_level_normalized, required: false, unknown_if_missing: true, expected: "required traffic category"}
      - {source: Vehicle, staged: vehicle_type, normalized: vehicle_type_normalized, required: false, unknown_if_missing: true, expected: "required vehicle category"}
      - {source: Area, staged: area_name, normalized: area_name_normalized, required: false, unknown_if_missing: true, expected: "required area category"}
      - {source: Delivery_Time, staged: delivery_time_minutes, required: true, cast_check: true, range: delivery_time, expected: "required decimal minutes within configured range"}
      - {source: Category, staged: category_name, normalized: category_name_normalized, required: false, unknown_if_missing: true, expected: "required delivery category"}
    ranges:
      agent_age: {min: 0, max: null, error_code: NEGATIVE_VALUE}
      agent_rating: {min: 1, max: 5, error_code: OUT_OF_RANGE}
      latitude: {min: -90, max: 90, error_code: OUT_OF_RANGE}
      longitude: {min: -180, max: 180, error_code: OUT_OF_RANGE}
      delivery_time: {min: 0, max: null, error_code: NEGATIVE_VALUE}
    age_groups:
      - {upper_exclusive: 18, label: "Under 18"}
      - {upper_exclusive: 25, label: "18-24"}
      - {upper_exclusive: 35, label: "25-34"}
      - {upper_exclusive: 45, label: "35-44"}
    age_group_else: "45+"
    rating_groups:
      - {upper_exclusive: 3, label: "[1,3)"}
      - {upper_exclusive: 4, label: "[3,4)"}
      - {upper_exclusive: 4.5, label: "[4,4.5)"}
    rating_group_else: "[4.5,5]"
    time_periods:
      - {upper_exclusive_hour: 6, label: Night}
      - {upper_exclusive_hour: 12, label: Morning}
      - {upper_exclusive_hour: 18, label: Afternoon}
    time_period_else: Evening
    operational_context_fields:
      - {staged: order_time, unknown_is_missing: false}
      - {staged: weather_name, unknown_is_missing: true}
      - {staged: traffic_level, unknown_is_missing: true}
    baseline_p90_minutes: 195
    delivery_time_iqr: {lower_minutes: -15, upper_minutes: 265}
    distance:
      earth_radius_km: 6371.0
      max_valid_km: 50
      invalid_store_latitude: 0
      invalid_store_longitude: 0
      status_invalid_store: "Store coordinates (0,0)"
      status_not_calculable: "Not calculable"
      status_outlier: "Outlier >{max_valid_km} km"
      status_valid: Valid
      band_invalid_store: "Not calculable (Store 0,0)"
      band_not_calculable: "Not calculable"
      band_outlier: ">{max_valid_km} km"
      bands:
        - {upper_exclusive_km: 5, label: "[0,5) km"}
        - {upper_exclusive_km: 10, label: "[5,10) km"}
        - {upper_exclusive_km: 15, label: "[10,15) km"}
        - {upper_exclusive_km: 20, label: "[15,20) km"}
      band_else: "[{last_band_start_km},{max_valid_km}] km"
    date_calendar: {start: "2022-01-01", end: "2022-12-31"}
    date_parse_style: 23
    reject_warning_severity: warn

models:
  amazon_delivery_bi:
    # The local SQL Server cannot grant enough memory to build columnstore indexes.
    +as_columnstore: false
    +persist_docs:
      relation: true
      columns: true
